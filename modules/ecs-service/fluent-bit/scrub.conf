# Fluent Bit filters applied to every log record before it is shipped to Datadog.
#
# FireLens generates the [SERVICE] and [OUTPUT] sections itself and @INCLUDEs this file,
# so this file must contain filters only. Adding a [SERVICE] section here breaks the task.

# 1. Drop anything the application explicitly flagged as containing patient data.
#    Cheaper and safer than trying to redact a record we already know is unsafe.
[FILTER]
    Name    grep
    Match   *
    Exclude contains_phi true

# 2. Redact emails, phone numbers, and known patient field names from everything else.
[FILTER]
    Name    lua
    Match   *
    script  /fluent-bit/etc/scrub.lua
    call    scrub

# 3. Strip request headers that routinely carry credentials or session identity.
[FILTER]
    Name    record_modifier
    Match   *
    Remove_key authorization
    Remove_key cookie
    Remove_key set-cookie
    Remove_key x-api-key
